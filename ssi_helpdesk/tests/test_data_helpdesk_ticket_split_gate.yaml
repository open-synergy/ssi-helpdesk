options:
  auto_refresh: true

scenarios:
  - name: "Split Gate - unfinished blocks confirm, cancelled and done do not"
    steps:
      - step: "Setup - create company partner"
        action: "create"
        model: "res.partner"
        save_as: "company"
        values:
          name: "Split Gate Company"
          is_company: true

      - step: "Setup - create contact person"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Split Gate Contact"
          is_company: false
          parent_id: "EVAL: registry['company'].id"

      - step: "Setup - create helpdesk type category"
        action: "create"
        model: "helpdesk_type_category"
        save_as: "type_category"
        values:
          name: "Split Gate Category"
          code: "SGCAT"

      - step: "Setup - create helpdesk type"
        action: "create"
        model: "helpdesk_type"
        save_as: "ticket_type"
        values:
          name: "Split Gate Type"
          code: "SGTYPE"
          category_id: "EVAL: registry['type_category'].id"

      - step: "Setup - create parent ticket"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "parent"
        as_user: "base.user_admin"
        values:
          title: "Split Gate Parent"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"

      - step: "Setup - create ticket split from the parent"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "child"
        as_user: "base.user_admin"
        values:
          title: "Split Gate Child"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"
          split_id: "EVAL: registry['parent'].id"

      - step: "Setup - parent action ready"
        action: "call"
        target: "parent"
        method: "action_ready"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "ready"

      - step: "Setup - parent action open"
        action: "call"
        target: "parent"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Setup - create second ticket split from the parent"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "child_cancelled"
        as_user: "base.user_admin"
        values:
          title: "Split Gate Child Cancelled"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"
          split_id: "EVAL: registry['parent'].id"

      - step: "Second split ticket action cancel"
        action: "call"
        target: "child_cancelled"
        method: "action_cancel"
        as_user: "base.user_admin"
        context:
          bypass_cancel_reason: true
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Confirm is rejected while a split ticket is draft"
        action: "call"
        target: "parent"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Split Gate Child"

      - step: "Parent stays open"
        action: "assert"
        target: "parent"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Split ticket action ready"
        action: "call"
        target: "child"
        method: "action_ready"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "ready"

      - step: "Split ticket action open"
        action: "call"
        target: "child"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Split ticket action confirm"
        action: "call"
        target: "child"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Split ticket action approve - confirm to done"
        action: "call"
        target: "child"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Parent action confirm succeeds"
        action: "call"
        target: "parent"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
