options:
  auto_refresh: true

scenarios:
  - name: "Communication Gate - pending communication blocks confirm and done"
    steps:
      - step: "Setup - create company partner"
        action: "create"
        model: "res.partner"
        save_as: "company"
        values:
          name: "Comm Gate Company"
          is_company: true

      - step: "Setup - create contact person"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Comm Gate Contact"
          is_company: false
          parent_id: "EVAL: registry['company'].id"

      - step: "Setup - create helpdesk type category"
        action: "create"
        model: "helpdesk_type_category"
        save_as: "type_category"
        values:
          name: "Comm Gate Category"
          code: "CGCAT"

      - step: "Setup - create helpdesk type"
        action: "create"
        model: "helpdesk_type"
        save_as: "ticket_type"
        values:
          name: "Comm Gate Type"
          code: "CGTYPE"
          category_id: "EVAL: registry['type_category'].id"

      - step: "Setup - create ticket"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "ticket"
        as_user: "base.user_admin"
        values:
          title: "Comm Gate Ticket"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"

      - step: "Setup - ticket action ready"
        action: "call"
        target: "ticket"
        method: "action_ready"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "ready"

      - step: "Setup - ticket action open"
        action: "call"
        target: "ticket"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Setup - create the holding communication"
        action: "create"
        model: "helpdesk_communication"
        save_as: "holder"
        as_user: "base.user_admin"
        values:
          title: "Comm Gate Holder"
          partner_id: "EVAL: registry['contact'].id"
          ticket_id: "EVAL: registry['ticket'].id"

      - step: "Setup - holding communication action open"
        action: "call"
        target: "holder"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm is rejected while a communication is open"
        action: "call"
        target: "ticket"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Comm Gate Holder"

      - step: "Ticket stays open"
        action: "assert"
        target: "ticket"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Setup - create the finishing communication"
        action: "create"
        model: "helpdesk_communication"
        save_as: "finishing"
        as_user: "base.user_admin"
        values:
          title: "Comm Gate Finishing"
          partner_id: "EVAL: registry['contact'].id"
          ticket_id: "EVAL: registry['ticket'].id"

      - step: "Setup - link the finishing communication to the ticket"
        action: "write"
        target: "ticket"
        as_user: "base.user_admin"
        values:
          finishing_communication_id: "EVAL: registry['finishing'].id"

      - step: "Setup - finishing communication action open"
        action: "call"
        target: "finishing"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Finishing the finishing communication is rejected"
        action: "call"
        target: "finishing"
        method: "action_done"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Comm Gate Holder"

      - step: "Finishing communication stays open"
        action: "assert"
        target: "finishing"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Ticket stays open after the rejected finish"
        action: "assert"
        target: "ticket"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Holding communication action done"
        action: "call"
        target: "holder"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Confirm succeeds once the holder is done"
        action: "call"
        target: "ticket"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Communication Gate - ticket without other communication"
    steps:
      - step: "Setup - create company partner"
        action: "create"
        model: "res.partner"
        save_as: "company"
        values:
          name: "Comm Gate Free Company"
          is_company: true

      - step: "Setup - create contact person"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Comm Gate Free Contact"
          is_company: false
          parent_id: "EVAL: registry['company'].id"

      - step: "Setup - create helpdesk type category"
        action: "create"
        model: "helpdesk_type_category"
        save_as: "type_category"
        values:
          name: "Comm Gate Free Category"
          code: "CGFCAT"

      - step: "Setup - create helpdesk type"
        action: "create"
        model: "helpdesk_type"
        save_as: "ticket_type"
        values:
          name: "Comm Gate Free Type"
          code: "CGFTYPE"
          category_id: "EVAL: registry['type_category'].id"

      - step: "Setup - create ticket"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "ticket"
        as_user: "base.user_admin"
        values:
          title: "Comm Gate Free Ticket"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"

      - step: "Setup - ticket action ready"
        action: "call"
        target: "ticket"
        method: "action_ready"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "ready"

      - step: "Setup - ticket action open"
        action: "call"
        target: "ticket"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Confirm succeeds without any other communication"
        action: "call"
        target: "ticket"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
