options:
  auto_refresh: true

scenarios:
  - name: "Force Close Gate - open documentation blocks confirm"
    steps:
      - step: "Setup - create company partner"
        action: "create"
        model: "res.partner"
        save_as: "company"
        values:
          name: "Force Close Company One"
          is_company: true

      - step: "Setup - create contact person"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Force Close Contact One"
          is_company: false
          parent_id: "EVAL: registry['company'].id"

      - step: "Setup - create ticket"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "ticket"
        as_user: "base.user_admin"
        values:
          title: "Force Close Ticket One"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"

      - step: "Setup - ticket action ready"
        action: "call"
        target: "ticket"
        method: "action_ready"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "ready"

      - step: "Setup - ticket action open"
        action: "call"
        target: "ticket"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Setup - create resolution documentation Runbook"
        action: "create"
        model: "helpdesk_ticket.resolution_documentation"
        save_as: "doc_a"
        as_user: "base.user_admin"
        values:
          ticket_id: "EVAL: registry['ticket'].id"
          name: "Runbook"

      - step: "Confirm is rejected while a documentation is open"
        action: "call"
        target: "ticket"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Runbook"

      - step: "Ticket stays open"
        action: "assert"
        target: "ticket"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Force close with a blank reason is rejected"
        action: "wizard"
        model: "helpdesk_ticket_force_close"
        target: "ticket"
        as_user: "base.user_admin"
        values:
          reason: "   "
        method: "action_confirm"
        expect_error:
          type: "UserError"
          message_contains: "reason is empty"

      - step: "Ticket is not marked force closed"
        action: "assert"
        target: "ticket"
        asserts:
          force_close_reason:
            type: "value"
            expected: false

      - step: "Force close with a reason"
        action: "wizard"
        model: "helpdesk_ticket_force_close"
        target: "ticket"
        as_user: "base.user_admin"
        values:
          reason: "Customer accepted the fix verbally"
        method: "action_confirm"

      - step: "Reason and user are recorded"
        action: "assert"
        target: "ticket"
        asserts:
          force_close_reason:
            type: "value"
            expected: "Customer accepted the fix verbally"
          force_close_user_id:
            type: "m2o"
            expected: "REF: base.user_admin"

      - step: "Confirm succeeds after force close"
        action: "call"
        target: "ticket"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve finishes the force closed ticket"
        action: "call"
        target: "ticket"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

