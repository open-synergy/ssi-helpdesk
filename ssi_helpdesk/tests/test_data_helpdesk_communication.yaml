setup:
  steps:
    - step: "Setup - create company partner"
      action: "create"
      model: "res.partner"
      save_as: "company"
      values:
        name: "Test Company HC"
        is_company: true

    - step: "Setup - create contact person"
      action: "create"
      model: "res.partner"
      save_as: "contact"
      values:
        name: "Test Contact HC"
        is_company: false
        parent_id: "EVAL: registry['company'].id"

    - step: "Setup - create additional contact"
      action: "create"
      model: "res.partner"
      save_as: "extra_contact"
      values:
        name: "Test Extra Contact HC"
        is_company: false
        parent_id: "EVAL: registry['company'].id"

    - step: "Setup - create helpdesk type category"
      action: "create"
      model: "helpdesk_type_category"
      save_as: "type_category"
      values:
        name: "Test Category HC"
        code: "TCATHC"

    - step: "Setup - create helpdesk type"
      action: "create"
      model: "helpdesk_type"
      save_as: "ticket_type"
      values:
        name: "Test Type HC"
        code: "TTYPEHC"
        category_id: "EVAL: registry['type_category'].id"

scenarios:
  - name: "Helpdesk Communication - Reload Followers From Ticket"
    steps:
      - step: "Create ticket with contact and additional partner"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "ticket"
        as_user: "base.user_admin"
        values:
          title: "Test Ticket HC"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"
          additional_partner_ids:
            - [6, 0, ["EVAL: registry['extra_contact'].id"]]

      - step: "Create communication linked to the ticket"
        action: "create"
        model: "helpdesk_communication"
        save_as: "communication"
        as_user: "base.user_admin"
        values:
          title: "Test Communication HC"
          partner_id: "EVAL: registry['contact'].id"
          ticket_id: "EVAL: registry['ticket'].id"

      - step: "Reload followers from the ticket"
        action: "call"
        target: "communication"
        method: "action_reload_followers"
        as_user: "base.user_admin"

      - step: "Assert ticket contact and additional partner follow"
        action: "assert"
        target: "communication"
        asserts:
          message_partner_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: contact"
              - "REC: extra_contact"

  - name: "Helpdesk Communication - Reload Followers Without Ticket"
    steps:
      - step: "Create communication without ticket"
        action: "create"
        model: "helpdesk_communication"
        save_as: "communication"
        as_user: "base.user_admin"
        values:
          title: "Test Communication No Ticket HC"
          partner_id: "EVAL: registry['contact'].id"

      - step: "Reload followers without a ticket does not fail"
        action: "call"
        target: "communication"
        method: "action_reload_followers"
        as_user: "base.user_admin"

      - step: "Verify the ticket contact was not subscribed"
        action: "search"
        model: "mail.followers"
        domain:
          - ["res_model", "=", "helpdesk_communication"]
          - ["res_id", "=", "REC: communication.id"]
          - ["partner_id", "=", "REC: contact.id"]
        save_as: "followers"
        expect_count: 0
