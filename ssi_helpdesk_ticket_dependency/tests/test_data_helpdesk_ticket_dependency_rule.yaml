options:
  auto_refresh: true

scenarios:
  - name: "Ticket Dependency - constraints and blocked flags"
    steps:
      - step: "Setup - create company partner"
        action: "create"
        model: "res.partner"
        save_as: "company"
        values:
          name: "Dep Rule Company"
          is_company: true
      - step: "Setup - create contact person"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Dep Rule Contact"
          is_company: false
          parent_id: "EVAL: registry['company'].id"
      - step: "Setup - create helpdesk type category"
        action: "create"
        model: "helpdesk_type_category"
        save_as: "type_category"
        values:
          name: "Dep Rule Category"
          code: "DRCAT"
      - step: "Setup - create helpdesk type"
        action: "create"
        model: "helpdesk_type"
        save_as: "ticket_type"
        values:
          name: "Dep Rule Type"
          code: "DRTYPE"
          category_id: "EVAL: registry['type_category'].id"
      - step: "Setup - create ticket Dep Rule A"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "t_a"
        as_user: "base.user_admin"
        values:
          title: "Dep Rule A"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"
      - step: "Setup - create ticket Dep Rule B"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "t_b"
        as_user: "base.user_admin"
        values:
          title: "Dep Rule B"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"
      - step: "Setup - create ticket Dep Rule C"
        action: "create"
        model: "helpdesk_ticket"
        save_as: "t_c"
        as_user: "base.user_admin"
        values:
          title: "Dep Rule C"
          partner_id: "EVAL: registry['contact'].id"
          commercial_partner_id: "EVAL: registry['company'].id"
          type_id: "EVAL: registry['ticket_type'].id"
          type_category_id: "EVAL: registry['type_category'].id"
      - step: "Self blocking is rejected"
        action: "create"
        model: "helpdesk_ticket.dependency"
        values:
          ticket_id: "EVAL: registry['t_a'].id"
          blocker_kind: "ticket"
          blocker_ticket_id: "EVAL: registry['t_a'].id"
          dependency_type: "fs"
        expect_error:
          type: "ValidationError"
          message_contains: "depend on itself"
      - step: "Ticket blocker without ticket is rejected"
        action: "create"
        model: "helpdesk_ticket.dependency"
        values:
          ticket_id: "EVAL: registry['t_a'].id"
          blocker_kind: "ticket"
          dependency_type: "fs"
        expect_error:
          type: "ValidationError"
          message_contains: "ticket and dependency type are required"
      - step: "External blocker without reference is rejected"
        action: "create"
        model: "helpdesk_ticket.dependency"
        values:
          ticket_id: "EVAL: registry['t_a'].id"
          blocker_kind: "external"
        expect_error:
          type: "ValidationError"
          message_contains: "External reference is required"
      - step: "A depends on B"
        action: "create"
        model: "helpdesk_ticket.dependency"
        save_as: "d_ab"
        values:
          ticket_id: "EVAL: registry['t_a'].id"
          blocker_kind: "ticket"
          blocker_ticket_id: "EVAL: registry['t_b'].id"
          dependency_type: "fs"
      - step: "Duplicated pair is rejected"
        action: "create"
        model: "helpdesk_ticket.dependency"
        values:
          ticket_id: "EVAL: registry['t_a'].id"
          blocker_kind: "ticket"
          blocker_ticket_id: "EVAL: registry['t_b'].id"
          dependency_type: "ss"
        expect_error:
          type: "ValidationError"
          message_contains: "already listed"
      - step: "Cycle A to B to A is rejected"
        action: "create"
        model: "helpdesk_ticket.dependency"
        values:
          ticket_id: "EVAL: registry['t_b'].id"
          blocker_kind: "ticket"
          blocker_ticket_id: "EVAL: registry['t_a'].id"
          dependency_type: "fs"
        expect_error:
          type: "ValidationError"
          message_contains: "cycle"
      - step: "B depends on C"
        action: "create"
        model: "helpdesk_ticket.dependency"
        save_as: "d_bc"
        values:
          ticket_id: "EVAL: registry['t_b'].id"
          blocker_kind: "ticket"
          blocker_ticket_id: "EVAL: registry['t_c'].id"
          dependency_type: "fs"
      - step: "Cycle A to B to C to A is rejected"
        action: "create"
        model: "helpdesk_ticket.dependency"
        values:
          ticket_id: "EVAL: registry['t_c'].id"
          blocker_kind: "ticket"
          blocker_ticket_id: "EVAL: registry['t_a'].id"
          dependency_type: "fs"
        expect_error:
          type: "ValidationError"
          message_contains: "cycle"
      - step: "A is start blocked by B"
        action: "assert"
        target: "t_a"
        asserts:
          start_blocked:
            type: "value"
            expected: true
          blocked:
            type: "value"
            expected: true
      - step: "Cancel B"
        action: "call"
        target: "t_b"
        method: "action_cancel"
        as_user: "base.user_admin"
        context:
          bypass_cancel_reason: true
        asserts:
          state:
            type: "value"
            expected: "cancel"
      - step: "A is released once B is cancelled"
        action: "assert"
        target: "t_a"
        asserts:
          start_blocked:
            type: "value"
            expected: false
          blocked:
            type: "value"
            expected: false
