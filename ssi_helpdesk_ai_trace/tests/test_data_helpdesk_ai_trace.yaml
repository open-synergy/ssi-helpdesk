options:
  auto_refresh: true

# Every scenario is self-sufficient: the setup replays before each one.
setup:
  steps:
    - step: "Create the customer company"
      action: "create"
      model: "res.partner"
      save_as: "company"
      values:
        name: "AI Trace Company HD"
        is_company: true

    - step: "Create the customer contact"
      action: "create"
      model: "res.partner"
      save_as: "contact"
      values:
        name: "AI Trace Contact HD"
        is_company: false
        parent_id: "REC: company.id"

    - step: "Create ticket A"
      action: "create"
      model: "helpdesk_ticket"
      save_as: "ticket_a"
      as_user: "base.user_admin"
      values:
        title: "AI Trace Ticket A"
        partner_id: "REC: contact.id"
        commercial_partner_id: "REC: company.id"

    - step: "Create ticket B"
      action: "create"
      model: "helpdesk_ticket"
      save_as: "ticket_b"
      as_user: "base.user_admin"
      values:
        title: "AI Trace Ticket B"
        partner_id: "REC: contact.id"
        commercial_partner_id: "REC: company.id"

    - step: "Get an empty ai_trace recordset to call the model API on"
      action: "search"
      model: "ai_trace"
      domain: [["id", "=", 0]]
      save_as: "trace_model"

scenarios:
  - name: "Entries stay on their own ticket and are counted"
    steps:
      - step: "Append three entries to ticket A and one to ticket B"
        action: "call"
        target: "trace_model"
        method: "ai_trace_append"
        args:
          - - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 1
              kind: "turn"
              prompt: "a1"
            - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 2
              kind: "turn"
              prompt: "a2"
            - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 3
              kind: "turn"
              prompt: "a3"
            - model: "helpdesk_ticket"
              res_id: "REC: ticket_b.id"
              session_key: "session-1"
              turn: 1
              kind: "turn"
              prompt: "b1"

      - step: "Ticket A counts its three entries"
        action: "assert"
        target: "ticket_a"
        asserts:
          ai_trace_count:
            type: "value"
            expected: 3
          ai_trace_ids:
            type: "o2m"
            check: "count"
            expected_count: 3

      - step: "Ticket B counts its single entry"
        action: "assert"
        target: "ticket_b"
        asserts:
          ai_trace_count:
            type: "value"
            expected: 1
          ai_trace_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Exactly three entries point at ticket A"
        action: "search"
        model: "ai_trace"
        domain:
          - ["model", "=", "helpdesk_ticket"]
          - ["res_id", "=", "REC: ticket_a.id"]
        save_as: "entries_a"
        expect_count: 3

  - name: "The entry takes the company of the ticket"
    steps:
      - step: "Append one entry to ticket A"
        action: "call"
        target: "trace_model"
        method: "ai_trace_append"
        args:
          - - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 1
              kind: "turn"

      - step: "Find the entry"
        action: "search"
        model: "ai_trace"
        domain:
          - ["model", "=", "helpdesk_ticket"]
          - ["res_id", "=", "REC: ticket_a.id"]
        save_as: "entry"
        expect_count: 1

      - step: "Assert the company of the entry is the ticket company"
        action: "assert"
        target: "entry"
        asserts:
          company_id:
            type: "m2o"
            expected_xml_id: "base.main_company"

      - step: "Assert the company of the ticket"
        action: "assert"
        target: "ticket_a"
        asserts:
          company_id:
            type: "m2o"
            expected_xml_id: "base.main_company"

  - name: "Appending the same batch again keeps the count"
    steps:
      - step: "Append three entries to ticket A"
        action: "call"
        target: "trace_model"
        method: "ai_trace_append"
        args:
          - - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 1
              kind: "turn"
            - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 2
              kind: "turn"
            - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 3
              kind: "turn"

      - step: "Append the same three entries again"
        action: "call"
        target: "trace_model"
        method: "ai_trace_append"
        args:
          - - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 1
              kind: "turn"
            - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 2
              kind: "turn"
            - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 3
              kind: "turn"

      - step: "Ticket A still counts three entries"
        action: "assert"
        target: "ticket_a"
        asserts:
          ai_trace_count:
            type: "value"
            expected: 3

  - name: "The portal customer of the ticket cannot read its traces"
    steps:
      - step: "Create the portal user of the customer contact"
        action: "create"
        model: "res.users"
        save_as: "portal_user"
        context:
          no_reset_password: true
        values:
          name: "AI Trace Portal HD"
          login: "ai_trace_portal_hd"
          partner_id: "REC: contact.id"
          groups_id: [[6, 0, ["REF: base.group_portal"]]]

      - step: "Append one entry to ticket A"
        action: "call"
        target: "trace_model"
        method: "ai_trace_append"
        args:
          - - model: "helpdesk_ticket"
              res_id: "REC: ticket_a.id"
              session_key: "session-1"
              turn: 1
              kind: "turn"

      - step: "Find the entry as the superuser"
        action: "search"
        model: "ai_trace"
        domain:
          - ["model", "=", "helpdesk_ticket"]
          - ["res_id", "=", "REC: ticket_a.id"]
        save_as: "entry"
        expect_count: 1

      - step: "The portal customer cannot read the entry"
        action: "call"
        target: "entry"
        method: "read"
        as_user: "portal_user"
        args:
          - ["turn"]
        expect_error:
          type: "AccessError"
