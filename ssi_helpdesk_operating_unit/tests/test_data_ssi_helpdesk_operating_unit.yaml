      - step: "Create user restricted to a different operating unit"
        action: "create"
        model: "res.users"
        save_as: "restricted_user"
        values:
          name: "Helpdesk Communication OU Restricted User"
          login: "ou_restricted_helpdesk_communication@example.com"
